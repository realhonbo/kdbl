description "Bind new_root to /overlay after user storage is ready"

start on mounted_userstore

emits overlay_ready

task

script
    set -e

    mountpoint -q /mnt/us
    test -d /mnt/us/new_root
    test -d /overlay

    if ! mountpoint -q /overlay; then
        mount --bind /mnt/us/new_root /overlay
    fi

    mountpoint -q /overlay
    initctl emit --no-wait overlay_ready
end script
